<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kcal AI</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        /* Фон темы (--page-bg ставит Walk.kt): им подложена страница, пока мир прогулки не проявился. */
        html { background: var(--page-bg, #f4efe4); }
        /* Мир прогулки — под страницей (холст Compose прозрачен, фон корня на прогулке уходит), клики идут в дневник.
           Над миром колонка дневника — матовое стекло той же ширины (COLUMN_MAX = 760px в DiaryPage.kt): мир за ней
           размыт и притушен цветом темы, чтобы сообщения читались. Плотность и размытие — панель прогулки (walk/kcal/tune.js). */
        canvas#atlas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: -2; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
        #walk-glass { position: fixed; top: 0; bottom: 0; left: 50%; width: min(760px, 100%); transform: translateX(-50%); z-index: -1; pointer-events: none;
            background: color-mix(in srgb, var(--page-bg) calc(var(--glass-tint, 0.62) * 100%), transparent);
            -webkit-backdrop-filter: blur(var(--glass-blur, 10px)); backdrop-filter: blur(var(--glass-blur, 10px)); }
        body.walking canvas#atlas { opacity: 1; }
    </style>
    <script type="importmap">{ "imports": { "three": "./walk/vendor/three/build/three.module.js", "three/addons/": "./walk/vendor/three/examples/jsm/" } }</script>
    <script>
        // Мир прогулки (walk/, papertrails + Зёрнышко) весит ~12 МБ: грузим его, только когда пошли.
        window.KcalWalkStart = function () {
            if (window.KcalEmbedded) return;
            window.KcalEmbedded = true;   // горячие клавиши papertrails молчат: поле ввода — для еды
            var atlas = document.createElement('canvas'); atlas.id = 'atlas'; atlas.tabIndex = -1; document.body.prepend(atlas);
            var glass = document.createElement('div'); glass.id = 'walk-glass'; atlas.after(glass);
            var hint = document.createElement('div'); hint.id = 'hint'; hint.hidden = true; document.body.appendChild(hint);
            import('./walk/kcal/autopilot.js').then(function () { return import('./walk/kcal/hero.js'); }).then(function () { return import('./walk/kcal/tune.js'); }).then(function () { return import('./walk/kcal/trail.js'); }).then(function () { return import('./walk/kcal/friends.js'); }).then(function () { return import('./walk/kcal/events.js'); }).then(function () { return import('./walk/src/main.js'); });
        };

    </script>
    <script src="web.js"></script>
</head>
<body></body>
</html>
