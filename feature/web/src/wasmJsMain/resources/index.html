<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kcal AI</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        /* Фон темы (--page-bg ставит Walk.kt): им подложена страница, пока мир прогулки не проявился. */
        html { background: var(--page-bg, #f4efe4); }
        /* Мир прогулки — под страницей (холст Compose прозрачен, фон корня на прогулке уходит), клики идут в дневник.
           Над миром колонка дневника — матовое стекло той же ширины (COLUMN_MAX = 760px в DiaryPage.kt): мир за ней
           размыт и притушен цветом темы, чтобы сообщения читались. Плотность и размытие — панель прогулки (walk/kcal/tune.js). */
        canvas#atlas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: -2; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
        #walk-glass { position: fixed; top: 0; bottom: 0; left: 50%; width: min(760px, 100%); transform: translateX(-50%); z-index: -1; pointer-events: none;
            background: color-mix(in srgb, var(--page-bg) calc(var(--glass-tint, 0.62) * 100%), transparent);
            -webkit-backdrop-filter: blur(var(--glass-blur, 10px)); backdrop-filter: blur(var(--glass-blur, 10px)); }
        body.walking canvas#atlas { opacity: 1; }
    </style>
    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }</script>
    <script>
        // Мир прогулки (walk/, papertrails + Зёрнышко) весит ~12 МБ: грузим его, только когда пошли.
        window.KcalWalkStart = function () {
            if (window.KcalEmbedded) return;
            window.KcalEmbedded = true;   // горячие клавиши papertrails молчат: поле ввода — для еды
            var atlas = document.createElement('canvas'); atlas.id = 'atlas'; atlas.tabIndex = -1; document.body.prepend(atlas);
            var glass = document.createElement('div'); glass.id = 'walk-glass'; atlas.after(glass);
            var hint = document.createElement('div'); hint.id = 'hint'; hint.hidden = true; document.body.appendChild(hint);
            import('./walk/kcal/autopilot.js').then(function () { return import('./walk/kcal/hero.js'); }).then(function () { return import('./walk/kcal/tune.js'); }).then(function () { return import('./walk/kcal/food.js'); }).then(function () { return import('./walk/src/main.js'); });
        };

        // Беговая дорожка — по Bluetooth (FTMS). Тонкий адаптер: подключиться и отдавать сырые пакеты; разбирает их
        // и решает, что с ними делать, общий код (n7.kcalai.model.Treadmill, страница — Treadmill.kt).
        // Состояния: unsupported — браузер не умеет Bluetooth; needPair — дорожку ещё не выбирали; waiting — ждём, когда
        // знакомая дорожка включится; connecting; connected; needTap — без касания не подключиться (так устроен Bluetooth).
        window.KcalTreadmill = (function () {
            var bt = navigator.bluetooth, FTMS = 0x1826, DATA = 0x2acd, onPacket = null, onState = null, abort = null, hooked = [];
            function state(s) { if (onState) onState(s); }
            function hex(v) { var s = ''; for (var i = 0; i < v.byteLength; i++) s += ('0' + v.getUint8(i).toString(16)).slice(-2); return s; }
            function hook(d) {
                if (hooked.indexOf(d) >= 0) return;
                hooked.push(d);
                d.addEventListener('gattserverdisconnected', function () { state('waiting'); waitFor(d); });
            }
            async function connect(d) {
                hook(d); state('connecting');
                try {
                    var server = await d.gatt.connect();
                    var ch = await (await server.getPrimaryService(FTMS)).getCharacteristic(DATA);
                    ch.addEventListener('characteristicvaluechanged', function (e) { if (onPacket) onPacket(hex(e.target.value)); });
                    await ch.startNotifications();
                    state('connected');
                } catch (e) { state('needTap'); }
            }
            async function waitFor(d) {
                hook(d);
                if (!d.watchAdvertisements) { state('needTap'); return; }
                if (abort) abort.abort();
                abort = new AbortController();
                d.addEventListener('advertisementreceived', function () { abort.abort(); connect(d); }, { once: true });
                state('waiting');
                try { await d.watchAdvertisements({ signal: abort.signal }); } catch (e) { state('needTap'); }
            }
            return {
                start: async function (packet, changed) {
                    onPacket = packet; onState = changed;
                    if (!bt) { state('unsupported'); return; }
                    var known = bt.getDevices ? await bt.getDevices().catch(function () { return []; }) : [];
                    if (known.length) waitFor(known[0]); else state('needPair');
                },
                pair: async function () {
                    try { connect(await bt.requestDevice({ filters: [{ services: [FTMS] }] })); }
                    catch (e) { if (!e || e.name !== 'NotFoundError') state('needTap'); }
                },
            };
        })();
    </script>
    <script src="web.js"></script>
</head>
<body></body>
</html>
