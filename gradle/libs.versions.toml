[versions]
agp = "9.3.2"
# Версия Kotlin, встроенного в AGP 9.3.2. Объявлена только ради compose-компилятора:
# сам org.jetbrains.kotlin.android применять нельзя — он сломает сборку.
kotlin = "2.2.10"
# AGP 9.3.2 тянет 2.2.10-2.0.2, но та падает на KMP-цели android
# (ClassCastException KotlinMultiplatformAndroidCompilationImpl). С 2.3 версия KSP
# не привязана к версии Kotlin, и явная 2.3.x перекрывает транзитивную.
ksp = "2.3.10"
room = "2.8.5"
sqlite = "2.7.1"
# 1.11.0 требует kotlin-stdlib 2.2.20 — новее встроенного в AGP компилятора 2.2.10.
coroutines = "1.10.2"
# 3.3.0 — последняя на stdlib 2.2.10: 3.3.1 уже требует 2.2.20, новее встроенного в AGP компилятора.
ktor = "3.3.0"
# JsonElement API без компиляторного плагина. 1.9.0 — та, что тянет Ktor 3.3.0.
serializationJson = "1.9.0"
# Compose Multiplatform: 1.9 — линия под Kotlin 2.2. Версии рядом с ним — те,
# что выходили в паре: material3 1.9.0, lifecycle 2.9.x. На Android артефакты
# JetBrains ведут на androidx, и BOM приложения поднимает их до своих версий.
cmp = "1.9.3"
cmpMaterial3 = "1.9.0"
# Иконки после 1.7.3 не выпускаются: набор заморожен и живёт как есть.
cmpIcons = "1.7.3"
cmpLifecycle = "2.9.6"
# 0.7.x: Instant и Clock переехали в kotlin.time, здесь — зоны и календарь.
datetime = "0.7.1"
# Потолок задаёт compileSdk 36: BOM 2026.08+ тянет compose ui 1.12.x с minCompileSdk 37.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
# 2.11.0 требует compileSdk 37.
lifecycle = "2.10.0"
# 1.19.0 требует compileSdk 37.
coreKtx = "1.18.0"
material = "1.10.0"
# minCompileSdk = 36 — ровно наш потолок, запаса нет.
camerax = "1.6.2"
# Bundled-вариант: модель распознавания внутри APK, работает без сети
# и без Google Play Services. Unbundled докачивает её — не подходит.
mlkitBarcode = "17.3.0"
# PP-OCRv5 через LiteRT — единственный путь к кириллице на устройстве.
# Заголовки C++ в артефакте не публикуются и лежат в core/ocr/src/main/cpp:
# в AAR нет prefab, а публичные исходники не совпадают с этим бинарником.
# Меняя версию здесь, надо сверить заголовки.
litert = "2.1.0"
work = "2.11.2"
junit = "4.13.2"
junitVersion = "1.1.5"
# Раннер отдельной зависимостью: androidx.test.ext:junit его за собой не тянет,
# а без него инструментальный запуск падает на ClassNotFoundException.
testRunner = "1.5.2"
espressoCore = "3.5.1"
# Пара к раннеру 1.5.x: водит собранное приложение снаружи, как человек пальцем.
uiautomator = "2.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "cmp" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "cmp" }
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "cmp" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
cmp-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "cmpIcons" }
cmp-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "cmp" }
# Системное «назад» в общем коде: из прошлого дня возвращает к сегодня.
cmp-ui-backhandler = { group = "org.jetbrains.compose.ui", name = "ui-backhandler", version.ref = "cmp" }
cmp-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "cmpLifecycle" }
cmp-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "cmpLifecycle" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
# Движок поверх HttpURLConnection: без OkHttp (~800 КБ) ради трёх запросов.
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Виртуальное время и подмена главного диспетчера — для тестов экранных моделей.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
# Официальное превью для Compose: CameraXViewfinder вместо PreviewView в AndroidView.
androidx-camera-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Отдельный модуль тестов против собранного приложения — :smoke.
android-test = { id = "com.android.test", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Выгрузка схемы базы в schemas/: по ней строятся и проверяются миграции.
room = { id = "androidx.room", version.ref = "room" }
# Начиная с Kotlin 2.0 AGP требует его явно при buildFeatures.compose = true.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
