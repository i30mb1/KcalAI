[versions]
# Шагомер телефона на Android — Health Connect: шаги самого телефона и фитнес-приложений.
healthConnect = "1.1.0"
playServicesFitness = "21.3.0"
agp = "9.5.1"
# Новее встроенного в AGP 9.3.2 (2.2.10): iOS-клибы Compose Multiplatform 1.12 собраны 2.3.20,
# и Kotlin/Native 2.2 их не читает.
# Подменяется в build-logic, номер обязан совпадать с тамошним. Сам
# org.jetbrains.kotlin.android применять нельзя — он сломает сборку.
kotlin = "2.4.21"
# AGP 9.3.2 тянет 2.2.10-2.0.2, но та падает на KMP-цели android
# (ClassCastException KotlinMultiplatformAndroidCompilationImpl). С 2.3 версия KSP
# не привязана к версии Kotlin, и явная 2.3.x перекрывает транзитивную.
ksp = "2.3.14"
room = "2.8.5"
sqlite = "2.7.1"
coroutines = "1.11.0"
ktor = "3.6.1"
# JsonElement API без компиляторного плагина. Не ниже той, что тянет Ktor.
serializationJson = "1.13.0"
# Compose Multiplatform 1.12: MeshGradientPainter в общем коде. Material3 у JetBrains
# стабилен только в 1.9.0, lifecycle — 2.9.x. На Android артефакты JetBrains ведут
# на androidx, и BOM приложения поднимает их до своих версий.
cmp = "1.12.2"
cmpMaterial3 = "1.9.0"
# Иконки после 1.7.3 не выпускаются: набор заморожен и живёт как есть.
cmpIcons = "1.7.3"
cmpLifecycle = "2.11.0"
cmpNavigationEvent = "1.1.0"
# 0.7.x: Instant и Clock переехали в kotlin.time, здесь — зоны и календарь.
datetime = "0.8.0"
# Файлы в общем коде: не ниже той, что тянет Ktor (3.6.1 — 0.9.1), в сборке остаётся одна.
io = "0.9.3"
# Окно браузера, WebSocket и localStorage для страницы дневника на Kotlin/Wasm. Та же, что тянет Compose.
kotlinxBrowser = "0.5.0"
# Compose 1.12 — пара к CMP 1.12. Требует compileSdk 37.
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# Не ниже той, что требует CMP 1.12 (androidx lifecycle-viewmodel-compose 2.11.0).
lifecycle = "2.11.0"
coreKtx = "1.19.1"
material = "1.14.0"
# Морфинг форм (RoundedPolygon, Morph): мультиплатформенная, iOS включительно.
graphicsShapes = "1.1.0"
camerax = "1.6.2"
# Bundled-вариант: модель распознавания внутри APK, работает без сети
# и без Google Play Services. Unbundled докачивает её — не подходит.
mlkitBarcode = "17.3.0"
# PP-OCRv5 через LiteRT — единственный путь к кириллице на устройстве.
# Заголовки C++ в артефакте не публикуются и лежат в core/ocr/src/main/cpp:
# в AAR нет prefab, а публичные исходники не совпадают с этим бинарником.
# Меняя версию здесь, надо сверить заголовки.
litert = "2.1.0"
work = "2.12.0"
junit = "4.13.2"
# Gemini Nano на телефоне через AICore: агент с инструментами и Prompt API с типизированным
# ответом. Агент в alpha, Prompt API в beta — API может меняться между версиями.
mlkitGenaiAgent = "1.0.0-alpha1"
mlkitGenaiPrompt = "1.0.0-beta5"
# Процессор @Generable: схема ответа модели генерируется на сборке, а не отражением.
mlkitGenaiSchema = "1.0.0-alpha2"
# Инструменты агента — AppFunctions платформы (Android 16+), схема из KDoc на сборке.
appfunctions = "1.0.0-beta01"
# Поиск по смыслу: отпечаток запроса считает EmbeddingGemma через LiteRT-LM (до 1.0,
# API меняется). Та же версия litertlm-jvm в tools/embeddb — отпечатки справочника
# и запроса обязаны считаться одним движком.
litertlm = "0.19.1"
# Модель поиска по смыслу (165 МБ) приезжает fast-follow паком сразу после установки.
playAssetDelivery = "2.3.0"
junitVersion = "1.3.0"
# Раннер отдельной зависимостью: androidx.test.ext:junit его за собой не тянет,
# а без него инструментальный запуск падает на ClassNotFoundException.
testRunner = "1.7.0"
espressoCore = "3.7.0"
# Пара к раннеру 1.7.x: водит собранное приложение снаружи, как человек пальцем.
uiautomator = "2.4.1"

[libraries]
health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
play-services-fitness = { module = "com.google.android.gms:play-services-fitness", version.ref = "playServicesFitness" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
play-asset-delivery-ktx = { group = "com.google.android.play", name = "asset-delivery-ktx", version.ref = "playAssetDelivery" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { group = "androidx.sqlite", name = "sqlite-bundled-jvm", version.ref = "sqlite" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "cmp" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "cmp" }
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "cmp" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
cmp-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "cmpIcons" }
cmp-material-icons-core = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "cmpIcons" }
cmp-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "cmp" }
# Системное «назад» в общем коде: из прошлого дня возвращает к сегодня.
# Версия — та, что тянет Compose Multiplatform 1.12.
cmp-navigationevent-compose = { group = "org.jetbrains.androidx.navigationevent", name = "navigationevent-compose", version.ref = "cmpNavigationEvent" }
cmp-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "cmpLifecycle" }
cmp-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "cmpLifecycle" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
# Движок поверх HttpURLConnection: без OkHttp (~800 КБ) ради трёх запросов.
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
# Приёмник предложений — на самом телефоне, поэтому сервер здесь, а не только в `server/`.
# CIO выбран потому, что единственный из движков собирается и под Kotlin/Native:
# Netty на iOS не живёт, а приёмник обязан быть на обеих платформах.
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
kotlinx-browser = { group = "org.jetbrains.kotlinx", name = "kotlinx-browser", version.ref = "kotlinxBrowser" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "io" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Виртуальное время и подмена главного диспетчера — для тестов экранных моделей.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
# Официальное превью для Compose: CameraXViewfinder вместо PreviewView в AndroidView.
androidx-camera-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

mlkit-genai-agent = { group = "com.google.mlkit", name = "genai-agent", version.ref = "mlkitGenaiAgent" }
mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "mlkitGenaiPrompt" }
mlkit-genai-schema-compiler = { group = "com.google.mlkit", name = "genai-schema-compiler", version.ref = "mlkitGenaiSchema" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Отдельный модуль тестов против собранного приложения — :smoke.
android-test = { id = "com.android.test", version.ref = "agp" }
# Пак Play Asset Delivery: модель поиска по смыслу — :assets:embedding.
android-asset-pack = { id = "com.android.asset-pack", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Выгрузка схемы базы в schemas/: по ней строятся и проверяются миграции.
room = { id = "androidx.room", version.ref = "room" }
# Начиная с Kotlin 2.0 AGP требует его явно при buildFeatures.compose = true.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Публикация в Google Play: :app:publishReleaseBundle.
play-publisher = { id = "com.github.triplet.play", version = "4.1.2" }
