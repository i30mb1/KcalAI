<title>Сады Зёрнышка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  /* Одна колонка-телефон: вкладка выбирает, что растёт; сцена — дорожка слева, растение справа;
     под сценой неделя. Симулятор прибит к низу. Палитра KcalAI. */
  :root {
    --bg: #F4EFE4; --surface: #FDFBF5; --chip: #F0E9D9; --line: #E5DCC9;
    --text: #2C2618; --text2: #6B6250; --text3: #8D8370;
    --bubble: #2C2618; --on-bubble: #F4EFE4;
    --carb: #4C8F5A; --shadow: rgba(44, 38, 24, 0.12);
    --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1914; --surface: #26221B; --chip: #332D23; --line: #3A3428;
      --text: #F4EFE4; --text2: #B5AB96; --text3: #8D8370;
      --bubble: #F4EFE4; --on-bubble: #1C1914;
      --carb: #5FA56E; --shadow: rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1914; --surface: #26221B; --chip: #332D23; --line: #3A3428;
    --text: #F4EFE4; --text2: #B5AB96; --text3: #8D8370;
    --bubble: #F4EFE4; --on-bubble: #1C1914;
    --carb: #5FA56E; --shadow: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 500 16px/1.4 var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 150px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--carb); outline-offset: 3px; border-radius: 6px; }
  svg { display: block; }

  .app { max-width: 440px; margin: 0 auto; display: grid; gap: 16px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; background: var(--chip); border-radius: 99px; padding: 4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; padding: 9px 14px; border-radius: 99px; font-weight: 700; font-size: 13px; color: var(--text2); transition: background .2s, color .2s; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px var(--shadow); }

  #view { display: grid; gap: 14px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .big { font: 800 clamp(56px, 16vw, 80px)/0.9 var(--font-ui); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
  .sub { color: var(--text3); font-weight: 600; text-align: right; }
  .sub b { display: block; color: var(--text); font: 600 20px/1.2 var(--font-data); font-variant-numeric: tabular-nums; }

  .bubble {
    position: relative; justify-self: center; max-width: 100%;
    min-height: 3.1em; display: flex; align-items: center; justify-content: center;
    background: var(--bubble); color: var(--on-bubble);
    font-weight: 700; font-size: 15px; line-height: 1.35;
    padding: 9px 16px; border-radius: 18px; text-wrap: balance; text-align: center;
  }
  .bubble::after {
    content: ""; position: absolute; left: 24%; bottom: -8px; width: 18px; height: 9px;
    background: var(--bubble); transform: translateX(-50%); clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .scene { width: 100%; height: auto; border-radius: 22px; overflow: hidden; }
  .g-hop { transform-box: fill-box; transform-origin: 50% 100%; }
  .g-hop.go { animation: hop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop { 40% { transform: translateY(-10px) scale(1.04, .97) } }
  .fade { transition: opacity .6s; }
  .pop { animation: pop .7s cubic-bezier(.3,1.5,.5,1); transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes pop { from { transform: scale(0) rotate(-60deg) } }

  .week { display: grid; gap: 10px; }
  .week-total { font: 600 12px/1 var(--font-data); color: var(--text3); text-align: center; }
  .shelf { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-items: end; padding: 0 6px; position: relative; }
  .shelf::after { content: ""; position: absolute; left: 0; right: 0; bottom: 18px; height: 7px; border-radius: 4px; background: #B08452; box-shadow: 0 3px 0 #8A6A45; }
  .shelf .slot { display: grid; justify-items: center; gap: 10px; }
  .shelf svg { width: 100%; height: auto; }
  .shelf span, .crate span { font: 600 11px/1 var(--font-data); color: var(--text3); }
  .shelf .today span, .crate .today span { color: var(--text); }
  .street { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; align-items: end; position: relative; padding: 0 4px; }
  .street::after { content: ""; position: absolute; left: 0; right: 0; bottom: 18px; height: 6px; border-radius: 3px; background: #A8C48E; }
  .street .slot, .sky7 .slot { display: grid; justify-items: center; gap: 10px; }
  .street svg, .sky7 svg { width: 100%; height: auto; }
  .street span, .sky7 span { font: 600 11px/1 var(--font-data); color: var(--text3); }
  .street .today span, .sky7 .today span { color: var(--text); }
  .sky7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 8px 4px 0; border-radius: 16px; background: linear-gradient(#DCEBF2, #F6F1E6); }
  .bubble.center::after { left: 50%; }
  .stage3d { position: relative; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; cursor: pointer; touch-action: manipulation; }
  .stage3d canvas { display: block; width: 100%; height: 100%; }
  .stage3d.space {
    background:
      radial-gradient(1.2px 1.2px at 12% 18%, #FFF7D6 99%, transparent), radial-gradient(1px 1px at 32% 70%, #FFF7D6 99%, transparent),
      radial-gradient(1.4px 1.4px at 78% 12%, #FFF7D6 99%, transparent), radial-gradient(1px 1px at 88% 58%, #FFF7D6 99%, transparent),
      radial-gradient(1px 1px at 55% 30%, #FFF7D6 99%, transparent), radial-gradient(1.3px 1.3px at 22% 88%, #FFF7D6 99%, transparent),
      radial-gradient(1px 1px at 66% 84%, #FFF7D6 99%, transparent), radial-gradient(1.2px 1.2px at 6% 52%, #FFF7D6 99%, transparent),
      radial-gradient(ellipse at 50% 40%, #33406A, #161C30 70%);
  }
  .stage3d.iso { background: linear-gradient(#E4EFE7, #FBF7EE); }
  .moons { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; padding: 14px 4px 0; border-radius: 16px; background: #161C30; }
  .moons .slot, .night7 .slot { display: grid; justify-items: center; gap: 8px; padding-bottom: 10px; }
  .moons i { border-radius: 50%; display: block; box-shadow: inset -3px -3px 0 rgba(0,0,0,.18); }
  .night7 { display: grid; grid-template-columns: repeat(7, 1fr); border-radius: 16px; background: linear-gradient(#10172A, #27324D); padding: 8px 4px 0; }
  .night7 svg { width: 100%; height: auto; }
  .moons span, .night7 span { font: 600 11px/1 var(--font-data); color: #B5AB96; }
  .moons .today span, .night7 .today span { color: #FDFBF5; }
  .sim {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); border-top: 1.5px dashed var(--line);
  }
  .sim-in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
  .sim .play { grid-row: span 2; width: 52px; height: 52px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; }
  .sim label { display: grid; grid-template-columns: 58px 1fr 76px; align-items: center; gap: 10px; font: 600 12px/1 var(--font-data); color: var(--text3); }
  .sim output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .sim input[type=range] { width: 100%; accent-color: var(--carb); }
  @media (prefers-reduced-motion: reduce) { .g-hop.go, .pop { animation: none; } .fade { transition: none; } }
</style>

<main class="app">
  <nav class="tabs" role="tablist">
    <button role="tab" data-v="flower">Цветок</button>
    <button role="tab" data-v="tree">Яблоня</button>
    <button role="tab" data-v="jar">Банка</button>
    <button role="tab" data-v="house">Домик</button>
    <button role="tab" data-v="balloon">Шар</button>
    <button role="tab" data-v="night">Звёзды</button>
    <button role="tab" data-v="planet">Планета</button>
    <button role="tab" data-v="cubes">Кубики</button>
  </nav>
  <section id="view"></section>
</main>

<div class="sim" aria-label="Симулятор дорожки">
  <div class="sim-in">
    <button class="play" id="play" aria-label="Идти или стоять"><svg width="20" height="20" viewBox="0 0 20 20" id="playIcon"></svg></button>
    <label>скорость<input type="range" id="spd" min="0" max="10" step="0.1"><output id="spdOut">0.0 км/ч</output></label>
    <label>сегодня<input type="range" id="stp" min="0" max="14000" step="50"><output id="stpOut">0</output></label>
  </div>
</div>

<script>
// ================= общее =================
const $ = (s, r = document) => r.querySelector(s);
const nf = new Intl.NumberFormat('ru-RU');
const fmt = (n) => nf.format(Math.max(0, Math.round(n)));
const km = (m) => (m / 1000).toFixed(2).replace('.', ',');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const f1 = (x) => x.toFixed(1);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const strideM = (v, h = 175) => (h / 100) * (0.26 + 0.035 * clamp(v, 1, 12));
const tierOf = (v) => (v <= 0 ? 0 : v < 3.5 ? 1 : v < 5.5 ? 2 : v < 7.5 ? 3 : 4);
const SIM_X = 30;
const GOAL = 8000;
// Рост по корню: первая тысяча шагов — уже треть растения. Мало ходить не стыдно, заметно сразу.
const growth = (steps) => (steps <= 0 ? 0 : Math.min(1, Math.sqrt(steps / GOAL)));

const state = { speed: 0, lastSpeed: 3.6, steps: 4300, distance: 3010 };
const PAST = [3200, 5100, 800, 6900, 8400, 10200]; // пример прошлых дней, не данные человека
const DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
function week() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86_400_000);
    out.push({ label: DOW[d.getDay()], dow: d.getDay(), steps: i === 0 ? state.steps : PAST[6 - i], today: i === 0 });
  }
  return out;
}
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mix(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const quad = (p0, c, p1, u) => ({ x: (1 - u) ** 2 * p0.x + 2 * (1 - u) * u * c.x + u * u * p1.x, y: (1 - u) ** 2 * p0.y + 2 * (1 - u) * u * c.y + u * u * p1.y });
function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }

// Реплика держится, пока не сменится; новость (новый листик) звучит 4 секунды.
const say = { el: null, news: '', until: 0 };
function news(text) { say.news = text; say.until = performance.now() + 4000; }
function speak(base) { setText(say.el, performance.now() < say.until ? say.news : base); }

// ================= Зёрнышко =================
const LIMB = (d, w1, w2) => `<path d="${d}" fill="none" stroke="#4C8F5A" stroke-width="${w1}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#7FBF8C" stroke-width="${w2}" stroke-linecap="round"/>`;
const BODY = 'M60,20 C80,20 90,46 90,64 C90,84 76,94 60,94 C44,94 30,84 30,64 C30,46 40,20 60,20 Z';
const TUFT = 'M60,22 L53,6 M60,22 L60,2 M60,22 L67,6';
class Grain {
  constructor(root) {
    root.innerHTML = `<g class="g-hop">
      <g class="g-lines" opacity="0" stroke="#8D8370" stroke-width="3" stroke-linecap="round"><path d="M22,50 L-8,50"/><path d="M18,64 L-20,64"/><path d="M22,78 L-4,78"/></g>
      <g class="g-legL">${LIMB('M52,86 L52,105', 10, 5.5)}</g><g class="g-legR">${LIMB('M68,86 L68,105', 10, 5.5)}</g>
      <g class="g-upper">
        <g class="g-armL">${LIMB('M32,70 C24,76 22,84 26,90', 13, 8)}</g><g class="g-armR">${LIMB('M88,70 C96,76 98,84 94,90', 13, 8)}</g>
        <g transform="rotate(4 60 60)">
          <g class="g-tuft"><path d="${TUFT}" transform="translate(.6 1.8)" stroke="#3B2A12" stroke-opacity=".35" stroke-width="4" stroke-linecap="round" fill="none"/><path d="${TUFT}" stroke="#4C8F5A" stroke-width="4" stroke-linecap="round" fill="none"/></g>
          <path d="${BODY}" transform="translate(.6 1.8)" fill="#3B2A12" fill-opacity=".35"/><path d="${BODY}" fill="#7FBF8C"/>
          <path d="M60,28 C57,42 54,52 56,62 C57,72 58,80 60,88" stroke="#3E7A4B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <g class="g-band fade" opacity="0"><g class="g-tails" stroke="#C2456F" stroke-width="4" stroke-linecap="round" fill="none"><path d="M37,47 C30,44 24,42 17,44"/><path d="M37,47 C30,50 25,53 18,55"/></g><path d="M37,47 C50,40 70,40 83,47" stroke="#C2456F" stroke-width="6.5" stroke-linecap="round" fill="none"/></g>
        </g>
        <g class="g-blush fade" opacity="0"><circle cx="40" cy="73" r="5" fill="#F3B5C8"/><circle cx="80" cy="73" r="5" fill="#F3B5C8"/></g>
        <g class="g-face" fill="none" stroke="#2C2618" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></g>
        <path class="g-sweat fade" opacity="0" d="M27,28 C30,33 31,36 28,38 C25,38 24,34 27,28 Z" fill="#A8D2EE" stroke="#5E8FB0" stroke-width=".8"/>
      </g></g>`;
    for (const k of ['hop', 'lines', 'legL', 'legR', 'upper', 'armL', 'armR', 'tuft', 'band', 'tails', 'blush', 'face', 'sweat']) this[k] = $(`.g-${k}`, root);
    this.phase = 0; this.tuftA = 0; this.blink = false; this.nextBlink = 0; this.faceKey = '';
    root.style.cursor = 'pointer';
    root.addEventListener('click', () => this.jump());
  }
  jump() { this.hop.classList.remove('go'); void this.hop.getBBox(); this.hop.classList.add('go'); }
  gear(speed, happy) {
    const tier = tierOf(speed);
    this.band.setAttribute('opacity', tier >= 2 ? 1 : 0);
    this.sweat.setAttribute('opacity', tier >= 3 ? 1 : 0);
    this.blush.setAttribute('opacity', tier >= 4 ? 1 : 0);
    this.lines.setAttribute('opacity', clamp((speed - 5) / 3, 0, 1).toFixed(2));
    const kind = this.blink ? 'blink' : tier >= 4 ? 'run' : tier === 3 ? 'push' : happy ? 'happy' : 'calm';
    this.drawFace(kind, tier > 0 ? 2 : 0);
  }
  drawFace(kind, x) {
    if (kind + x === this.faceKey) return;
    this.faceKey = kind + x;
    const m = x / 2;
    const dot = (cx, r = 5.5) => `<circle cx="${cx + x}" cy="62" r="${r}" fill="#2C2618" stroke="none"/>`;
    const arcUp = (cx) => `<path d="M${cx - 5 + x},63 Q${cx + x},56.5 ${cx + 5 + x},63"/>`;
    const arcDown = (cx) => `<path d="M${cx - 5 + x},61 Q${cx + x},66 ${cx + 5 + x},61"/>`;
    const smile = `<path d="M${54 + m},75 C${57 + m},79 ${63 + m},79 ${66 + m},75"/>`;
    this.face.innerHTML = {
      calm: dot(48) + dot(72) + smile,
      happy: arcUp(48) + arcUp(72) + `<path d="M${51 + m},74 C${56 + m},81 ${64 + m},81 ${69 + m},74"/>`,
      blink: arcDown(48) + arcDown(72) + smile,
      push: dot(48, 5) + dot(72, 5) + `<ellipse cx="${60 + m}" cy="77" rx="3.4" ry="4" fill="#2C2618" stroke="none"/>`,
      run: `<path d="M${43 + x},58.5 L${52 + x},62 L${43 + x},65.5"/><path d="M${77 + x},58.5 L${68 + x},62 L${77 + x},65.5"/><path d="M${53 + m},74 Q${60 + m},85 ${67 + m},74 Z" fill="#2C2618"/>`,
    }[kind];
  }
  step(dt, t, speed, happy) {
    const mps = speed / 3.6;
    this.phase += Math.PI * (mps / strideM(speed)) * dt;
    const amp = Math.min(14 + speed * 3.2, 40), a = Math.sin(this.phase) * amp, arm = a * (speed > 6 ? 0.9 : 0.55);
    this.legL.setAttribute('transform', `rotate(${f1(a)} 52 86)`);
    this.legR.setAttribute('transform', `rotate(${f1(-a)} 68 86)`);
    this.armL.setAttribute('transform', `rotate(${f1(arm)} 32 70)`);
    this.armR.setAttribute('transform', `rotate(${f1(-arm)} 88 70)`);
    const bob = -(1 - Math.abs(Math.sin(this.phase))) * (2 + speed * 0.4);
    this.upper.setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(${f1(speed * 0.9)} 60 96)`);
    this.tuftA += (-Math.min(speed * 7, 62) - this.tuftA) * Math.min(1, dt * 5);
    this.tuft.setAttribute('transform', `rotate(${f1(this.tuftA + Math.sin(t / 1000 * (4 + speed)) * speed * 0.7)} 60 22)`);
    this.tails.setAttribute('transform', `rotate(${f1(Math.sin(this.phase * 2) * 12 - speed * 3)} 37 47)`);
    if (t > this.nextBlink) { this.blink = !this.blink; this.nextBlink = t + (this.blink ? 130 : 2400 + Math.random() * 3000); }
    this.gear(speed, happy);
  }
  still(happy) {
    for (const [el, p] of [[this.legL, '52 86'], [this.legR, '68 86'], [this.armL, '32 70'], [this.armR, '88 70'], [this.tuft, '60 22'], [this.tails, '37 47']]) el.setAttribute('transform', `rotate(0 ${p})`);
    this.upper.removeAttribute('transform');
    this.tuftA = 0; this.blink = false;
    this.gear(0, happy);
  }
}

// ================= общая сцена: небо, погода от скорости, дорожка =================
function sceneSVG(v = {}) {
  const cloudPart = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FDFBF5" stroke="#D9CFBC" stroke-width="1.5"/>`;
  return `<svg class="scene" viewBox="0 0 400 300">
    <defs><linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${v.night ? '#10172A' : '#E4EFE7'}"/><stop offset="1" stop-color="${v.night ? '#2A3552' : '#FBF7EE'}"/></linearGradient></defs>
    <rect width="400" height="300" fill="url(#gsky)"/>
    <g id="sun" class="fade" opacity="0" transform="translate(372 36)"><g id="rays" stroke="#F0C077" stroke-width="3" stroke-linecap="round">${Array.from({ length: 10 }, (_, k) => `<path d="M0,-25 L0,-33" transform="rotate(${k * 36})"/>`).join('')}</g><circle r="18" fill="#F0C077"/></g>
    <g id="rainbow" class="fade" opacity="0" fill="none" stroke-width="7">${['#C2456F', '#C8862B', '#F0C077', '#7FBF8C', '#7FB5C9'].map((c, k) => `<path d="M${200 + k * 7},272 A${100 - k * 7},${100 - k * 7} 0 0 1 ${400 - k * 7},272" stroke="${c}" opacity=".5"/>`).join('')}</g>
    <rect y="270" width="400" height="30" fill="${v.night ? '#1C2620' : '#E9DEC6'}"/>
    <g id="back"></g>
    <g id="grow"></g>
    <g id="fx"></g>
    <g id="cloud" class="fade" opacity="0" transform="translate(296 26)">
      <ellipse rx="40" ry="15" fill="#FDFBF5" stroke="#D9CFBC" stroke-width="1.5"/>${cloudPart(-16, -9, 15)}${cloudPart(12, -13, 18)}<ellipse cy="2" rx="38" ry="11" fill="#FDFBF5"/>
    </g>
    <g id="rain"></g>
    <ellipse cx="88" cy="273" rx="80" ry="3" fill="rgba(44,38,24,.12)"/>
    <path d="M160,264 L176,198" stroke="#2C2618" stroke-width="6" stroke-linecap="round"/>
    <rect x="164" y="180" width="38" height="21" rx="5" fill="#2C2618"/><rect x="168" y="184" width="30" height="13" rx="2" fill="#1E2A1F"/>
    <text id="lcd" x="183" y="193.8" text-anchor="middle" fill="#A9D88A" style="font:600 9.5px var(--font-data)">0.0</text>
    <rect x="10" y="258" width="158" height="12" rx="6" fill="#2C2618"/>
    <line id="slats" x1="18" y1="261" x2="160" y2="261" stroke="#8D8370" stroke-width="2" stroke-dasharray="2 11" stroke-linecap="round"/>
    <g id="grain" transform="translate(30 150) scale(1.02)"></g>
  </svg>`;
}

// ================= варианты =================
// Вехи — по шагам сегодня; каждая звучит один раз, когда её прошли.
function milestones(list, every) {
  return (from, to) => {
    for (const [s, text] of list) if (from < s && to >= s) return text;
    if (every && to > every.from) {
      const a = Math.floor((from - every.from) / every.step), b = Math.floor((to - every.from) / every.step);
      if (b > a && b > 0) return every.text;
    }
    return null;

const VIEW_NAMES = ['Сбоку!', 'Сверху!', 'Крупно!', 'Издалека — и луны недели!'];
const Planet = {
  custom: true, cls: 'space', walk: 'Кручу планету!', lines: ['', '', 'Планета разгоняется!', 'Луны закружились!', 'Бегом — хохолок сдувает!'],
  idle: 'Планета пустая. Пройдёмся — оживёт!',
  rest: (s) => (s >= GOAL ? 'Планета цветёт! Наш маленький мир.' : 'Планета оживает — каждый шаг что-то сажает.'),
  marks: milestones([[100, 'Первый росток на планете!'], [2000, 'Уже рощица!'], [5000, 'Кто-то построил домик!'], [GOAL, 'Планета цветёт!']], { from: GOAL, step: 700, text: 'Новый житель!' }),
  fresh: () => ({}),
  async mount(el) {
    await loadThree();
    if (cur !== Planet || !el.isConnected) return;
    const st = this.st = new Stage3D(el), sc = st.scene;
    sc.add(new THREE.HemisphereLight(0xFFF4E0, 0x2B3656, 0.7));
    const sun = new THREE.DirectionalLight(0xFFE6BA, 0.85); sun.position.set(6, 9, -4); sc.add(sun);
    st.camera = new THREE.PerspectiveCamera(32, 4 / 3, 0.1, 100);
    st.onResize = (w, h) => { st.camera.aspect = w / h; st.camera.updateProjectionMatrix(); };
    this.planet = new THREE.Group(); sc.add(this.planet);
    this.planet.add(new THREE.Mesh(new THREE.IcosahedronGeometry(PLANET_R, 2), lambert(0x86B472)));
    const track = new THREE.Mesh(new THREE.TorusGeometry(PLANET_R + 0.02, 0.16, 6, 72), lambert(0xE9DEC6));
    track.rotation.y = Math.PI / 2; this.planet.add(track);
    for (let k = 0; k < 28; k++) {
      const a = (k / 28) * Math.PI * 2, d = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, 0.22), lambert(0xC9B79A));
      d.position.set(0, Math.cos(a) * (PLANET_R + 0.17), Math.sin(a) * (PLANET_R + 0.17)); d.rotation.x = a; this.planet.add(d);
    }
    this.things = [];
    this.grain = makeGrain3D(); this.grain.scale.setScalar(0.5);
    this.grain.position.set(0, PLANET_R + 0.19 + 1.34 * 0.5, 0); this.grain.rotation.y = Math.PI; sc.add(this.grain);
    this.moons = Array.from({ length: 7 }, () => { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), lambert(0xE9DEC6)); sc.add(m); return m; });
    this.orbit = 0;
    this.presets = [{ p: [9.5, 7, -7.5], l: [0, 2, 0] }, { p: [0, 15, -2.5], l: [0, 0, 0] }, { p: [2.6, 4.5, -2.8], l: [0, 3.7, 0] }, { p: [0, 2.5, -17], l: [0, 0.6, 0] }];
    this.view = 0;
    this.cam = { p: new THREE.Vector3(...this.presets[0].p), l: new THREE.Vector3(...this.presets[0].l) };

  },
  applyCam() { this.st.camera.position.copy(this.cam.p); this.st.camera.lookAt(this.cam.l); },
  nextView() {
    if (!this.st) return;
    const from = { p: this.cam.p.clone(), l: this.cam.l.clone() };
    this.view = (this.view + 1) % this.presets.length;
    const tp = new THREE.Vector3(...this.presets[this.view].p), tl = new THREE.Vector3(...this.presets[this.view].l);
    this.st.tween((k) => { const e = easeOut(k); this.cam.p.lerpVectors(from.p, tp, e); this.cam.l.lerpVectors(from.l, tl, e); this.applyCam(); }, 900);
    news(VIEW_NAMES[this.view]); render();
  },
  sync() {
    const n = planetCount(state.steps), up = new THREE.Vector3(0, 1, 0);
    while (this.things.length < n) {
      const s = PLANET_SLOTS[this.things.length], o = makeThing(s.type, s.hue), nv = new THREE.Vector3(s.n.x, s.n.y, s.n.z);
      o.position.copy(nv).multiplyScalar(PLANET_R * 0.985); o.quaternion.setFromUnitVectors(up, nv); o.scale.setScalar(0.001);
      this.planet.add(o); this.things.push(o);

    week().forEach((d, i) => {
      const m = this.moons[i];

  placeMoons() { this.moons.forEach((m, i) => { const a = this.orbit + (i * Math.PI * 2) / 7; m.position.set(Math.cos(a) * 5.6, 1 + Math.sin(a) * 1.5, Math.sin(a) * 5.6); }); },
  render() { if (!this.st) return; this.sync(); this.st.draw(); },
  frame(dt) {
    if (!this.st) return;

  still() { if (!this.st) return; stepGrain3D(this.grain, 0, 0); this.st.draw(); },
  unmount() { this.st?.dispose(); this.st = null; },
  below: (days) => `<div class="moons">${days.map((d) => {
    const size = d.steps > 0 ? 12 + 24 * growth(d.steps) : 8, c = d.steps >= GOAL ? '#F0C077' : d.today ? '#9FD3AA' : '#E9DEC6';
    return `<div class="slot${d.today ? ' today' : ''}"><i style="width:${f1(size)}px;height:${f1(size)}px;background:${c}"></i><span>${d.today ? '•' : d.label}</span></div>`;
  }).join('')}</div>`,
};

// --- 8. Кубики: неделя — изометрический остров, у дня своя башенка ---
const CUBE_COLORS = [0xD8C6A7, 0xC9A86A, 0xB5D3A7, 0x7FBF8C, 0x6CAE7A, 0x4C8F5A, 0x3E7A4B, 0x7FB5C9, 0x5B86C4];
const cubeCount = (steps) => (steps > 0 ? Math.max(1, Math.round(growth(steps) * 9)) : 0) + Math.min(Math.floor(Math.max(0, steps - GOAL) / 2000), 3);
function textSprite(text, color, weight = 600) {
  const c = document.createElement('canvas'); c.width = 160; c.height = 64;
  const x = c.getContext('2d');
  x.font = `${weight} 40px "JetBrains Mono", monospace`; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 80, 34);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(1.5, 0.6, 1);
  return s;
}
const Cubes = {
  custom: true, cls: 'iso', walk: 'Кладу кубики!', lines: ['', '', 'Хороший темп!', 'Кубики искрят!', 'Бегом — искры летят!'],
  idle: 'Остров ждёт. Пройдёмся — построим башенку!',
  rest: (s) => (s >= GOAL ? 'Башня с флажком! Хороший день.' : 'Кубик за кубиком — башенка растёт.'),
  marks: milestones([[100, 'Первый кубик!'], [2900, 'Уже полбашни!'], [GOAL, 'Башня с флажком!']], { from: GOAL, step: 2000, text: 'Золотой кубик сверху!' }),
  fresh: () => ({}),
  async mount(el) {
    await loadThree();
    if (cur !== Cubes || !el.isConnected) return;
    const st = this.st = new Stage3D(el), sc = st.scene;
    sc.add(new THREE.HemisphereLight(0xFFFFFF, 0x8A7A60, 0.65));
    const sun = new THREE.DirectionalLight(0xFFF1D6, 0.7); sun.position.set(4, 10, 6); sc.add(sun);
    st.camera = new THREE.OrthographicCamera(-5, 5, 4, -4, 0.1, 100);
    st.onResize = (w, h) => { const half = 5.4, a = w / h; Object.assign(st.camera, { left: -half, right: half, top: half / a, bottom: -half / a }); st.camera.updateProjectionMatrix(); };
    const soil = lambert(0xB08452), grass = lambert(0xA8C48E);
    const island = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.7, 2.8), [soil, soil, grass, soil, soil, soil]); island.position.set(0, -0.35, 0.2); sc.add(island);
    const pad = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.7, 1.1), [soil, soil, grass, soil, soil, soil]); pad.position.set(4.75, -0.35, 0.6); sc.add(pad);
    this.geo = new THREE.BoxGeometry(0.78, 0.5, 0.78);

  },
  placeCam() { this.st.camera.position.set(Math.cos(this.yaw) * 14, 10, Math.sin(this.yaw) * 14); this.st.camera.lookAt(0.4, 1.3, 0); },
  mat(c) { if (!this.mats.has(c)) this.mats.set(c, lambert(c)); return this.mats.get(c); },
  sync() {
    week().forEach((d, i) => {

const Night = {
  night: true, walk: 'Зажигаю звёзды!', lines: ['', '', 'Звёзды ярче!', 'Звездопад начинается!', 'Бегом — метеоры!'],
  idle: 'Ночь ясная. Пройдёмся — зажжём звёзды!',
  rest: (s) => (s >= GOAL ? 'Созвездие Зёрнышка! Это мы.' : 'Звёздочки горят — красиво.'),
  marks(prev, now) {
    for (const [s, text] of [[100, 'Первая звезда!'], [1100, 'Хохолок зажёгся!'], [GOAL, 'Созвездие Зёрнышка!']]) if (prev < s && now >= s) return text;
    return nightExtras(now) > nightExtras(prev) ? ['Созвездие Яйца!', 'Созвездие Масла!', 'Звездопад!'][nightExtras(now) - 1] : null;
  },
  fresh(prev, now) { return { star: starsLit(now) > starsLit(prev) ? starsLit(now) - 1 : -1, extra: nightExtras(now) > nightExtras(prev) ? nightExtras(now) - 1 : -1 }; },
  draw(t, fresh) { return nightSky(state.steps, t, fresh); },
  init() { this.meteors = []; },
  fx(dt) {
    if (state.speed <= 0) { this.meteors = []; $('#fx').innerHTML = ''; return; }
    const rate = state.speed * 0.22 + nightExtras(state.steps) * 0.7;
    if (Math.random() < rate * dt) this.meteors.push({ x: 150 + Math.random() * 250, y: 8 + Math.random() * 90, life: 1 });
    for (const m of this.meteors) { m.x -= 240 * dt; m.y += 120 * dt; m.life -= dt * 1.4; }
    this.meteors = this.meteors.filter((m) => m.life > 0);
    $('#fx').innerHTML = this.meteors.map((m) => `<path d="M${f1(m.x)},${f1(m.y)} l28,-14" stroke="#FFF7D6" stroke-width="1.8" stroke-linecap="round" opacity="${f1(m.life)}"/>`).join('');
  },
  below: (days) => `<div class="night7">${days.map((d) => `<div class="slot${d.today ? ' today' : ''}"><svg viewBox="0 0 60 70">${stars(shapes().grain, starsLit(d.steps), 30, 6, 0.52, { mini: true, full: d.steps >= GOAL })}</svg><span>${d.today ? '•' : d.label}</span></div>`).join('')}</div>`,

Object.assign(VARIANTS, { night: Night, planet: Planet, cubes: Cubes });

// ================= оркестр =================
// Тем много, данные одни: шаги дня и скорость. Тема — только как их показать.
let cur = null, curName = '', grain = null, lastSteps = state.steps, fresh = {}, freshUntil = 0, shelfKey = '';

function show(name) {
  if (!VARIANTS[name]) name = 'flower';
  cur?.unmount?.();
  curName = name; cur = VARIANTS[name];
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.setAttribute('aria-selected', b.dataset.v === name);
    if (b.dataset.v === name) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });
  $('#view').innerHTML = `
    <div class="head"><div class="big" id="n">0</div><div class="sub"><b id="km">0,00 км</b><span id="min">0 мин</span></div></div>
    <div class="bubble${cur.custom ? ' center' : ''}" id="say">…</div>
    ${cur.custom ? `<div class="stage3d ${cur.cls}" id="stage" title="Тап — другой ракурс"></div>` : sceneSVG(cur)}
    <div class="week"><div id="below"></div><div class="week-total" id="weekTotal"></div></div>`;
  say.el = $('#say'); say.until = 0;
  shelfKey = '';
  if (cur.custom) { grain = null; cur.mount($('#stage')); }
  else { cur.init?.(); grain = new Grain($('#grain')); Weather.reset(); }
  render(true);
  still();
  cur.back?.(0);
  loop();
}

function still() {
  if (cur.custom) { cur.still(); return; }
  Weather.reset(); cur.fx?.(0, 0); grain.still(state.steps >= GOAL);
}

function render(force = false) {
  const now = state.steps;
  if (now !== lastSteps) {
    const m = cur.marks(lastSteps, now);
    if (m && now > lastSteps) { news(m); grain?.jump(); }
    const f = cur.fresh(lastSteps, now);
    if (Object.values(f).some((v) => v === true || v >= 0)) { fresh = f; freshUntil = performance.now() + 800; }
    lastSteps = now;
  }
  if (performance.now() > freshUntil) fresh = {};
  setText($('#n'), fmt(now));
  setText($('#km'), `${km(state.distance)} км`);
  setText($('#min'), `${fmt(state.distance / 1000 / 3.6 * 60)} мин`);
  const tier = tierOf(state.speed);
  speak(now <= 0 && tier === 0 ? cur.idle : tier === 1 ? cur.walk : tier > 1 ? (cur.lines ?? WALK_LINES)[tier] : cur.rest(now));
  if (cur.custom) cur.render();
  else { Weather.render(); $('#grow').innerHTML = cur.draw(Weather.t, fresh); }
  const days = week();
  const key = curName + days.map((d) => Math.floor(d.steps / 250)).join();
  if (key !== shelfKey || force) {
    shelfKey = key;
    $('#below').innerHTML = cur.below(days);
    setText($('#weekTotal'), `за неделю ${fmt(days.reduce((s, d) => s + d.steps, 0))} шагов`);
  }
}

let raf = 0, lastT = 0, lastRender = 0;
function loop() { if (!raf && state.speed > 0) { lastT = 0; raf = requestAnimationFrame(frame); } }
function frame(t) {
  if (state.speed <= 0) { raf = 0; render(); still(); syncSim(); return; }
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.1) : 0;
  lastT = t;
  const mps = state.speed / 3.6;
  state.steps = Math.min(14000, state.steps + (mps / strideM(state.speed)) * dt * SIM_X);
  state.distance += mps * dt * SIM_X;
  if (!reduced) {
    if (cur.custom) cur.frame(dt, t);
    else {
      Weather.frame(dt, cur.area);
      grain.step(dt, t, state.speed, state.steps >= GOAL);
      $('#grow').innerHTML = cur.draw(Weather.t, fresh);
      cur.back?.(dt);
      cur.fx?.(dt, t);
    }
  }
  if (t - lastRender > (reduced ? 400 : 120)) { render(); syncSim(); lastRender = t; }
  if (state.steps >= 14000) setSpeed(0);
  raf = requestAnimationFrame(frame);
}
function setSpeed(v) {
  if (v > 0) state.lastSpeed = v;
  state.speed = v;
  syncSim(); render();
  if (v > 0) loop(); else still();
}
function syncSim() {
  $('#spd').value = state.speed;
  $('#spdOut').textContent = `${state.speed.toFixed(1)} км/ч`;
  $('#stp').value = Math.round(state.steps);
  $('#stpOut').textContent = fmt(state.steps);
  $('#playIcon').innerHTML = state.speed > 0
    ? '<rect x="4" y="3" width="4.5" height="14" rx="1" fill="currentColor"/><rect x="11.5" y="3" width="4.5" height="14" rx="1" fill="currentColor"/>'
    : '<path d="M5,3 L17,10 L5,17 Z" fill="currentColor"/>';
}
$('#play').addEventListener('click', () => setSpeed(state.speed > 0 ? 0 : state.lastSpeed));
$('#spd').addEventListener('input', (e) => setSpeed(+e.target.value));
$('#stp').addEventListener('input', (e) => {
  state.steps = +e.target.value;
  state.distance = state.steps * strideM(state.lastSpeed);
  syncSim(); render();
});
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { location.hash = b.dataset.v; }));
addEventListener('hashchange', () => show(location.hash.slice(1)));
syncSim();
show(location.hash.slice(1));
</script>
