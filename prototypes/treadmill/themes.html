<title>Пять миров дорожки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,500;1,600&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@600;700;800&family=Press+Start+2P&display=swap">
<style>
  /* Каждая тема — свой мир на весь экран; общие только переключатель сверху и симулятор снизу.
     Обвязка нарочно одна и та же в светлой и тёмной теме: тёмное стекло поверх любого мира. */
  :root {
    --glass: rgba(18, 16, 13, .62); --glass-line: rgba(255, 255, 255, .12); --on-glass: #F4EFE4; --on-glass2: rgba(244, 239, 228, .62);
    --simh: 68px;
    --font-ui: "Manrope", system-ui, sans-serif; --font-data: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; background: #14120F; color: var(--on-glass); }
  body { margin: 0; overflow: hidden; font: 600 14px/1.3 var(--font-ui); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid #F0C077; outline-offset: 2px; border-radius: 8px; }

  .stage { position: fixed; left: 0; right: 0; top: 0; bottom: calc(var(--simh) + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .switch {
    position: fixed; z-index: 10; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 4px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: calc(100vw - 24px);
  }
  .switch button { padding: 7px 13px; border-radius: 99px; color: var(--on-glass2); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .switch button[aria-selected="true"] { background: var(--on-glass); color: #14120F; }

  .sim {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: calc(var(--simh) + env(safe-area-inset-bottom, 0px));
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    background: #14120F; border-top: 1px solid var(--glass-line); display: flex; align-items: center;
  }
  .sim-in { width: 100%; max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr 1fr; gap: 18px; align-items: center; }
  .play { width: 44px; height: 44px; border-radius: 50%; background: var(--on-glass); color: #14120F; display: grid; place-items: center; }
  .sim label { display: grid; grid-template-columns: auto 1fr 64px; gap: 10px; align-items: center; font: 600 11px/1 var(--font-data); color: var(--on-glass2); min-width: 0; }
  .sim output { color: var(--on-glass); text-align: right; font-variant-numeric: tabular-nums; }
  .sim input[type=range] { width: 100%; min-width: 0; accent-color: #F0C077; }
  @media (max-width: 560px) { .sim-in { grid-template-columns: auto 1fr; gap: 6px 12px; } .play { grid-row: span 2; } :root { --simh: 92px; } }

  /* ---------- Шрифт ---------- */
  .type { position: absolute; inset: 0; background: #ECE8DF; color: #111; transition: background .5s, color .5s; overflow: hidden; }
  .type.done { background: #2B44FF; color: #F4F1EA; }
  .type .cap { position: absolute; font: 600 clamp(11px, .75vw, 16px)/1.5 var(--font-data); letter-spacing: .12em; text-transform: uppercase; }
  .type .num-wrap { position: absolute; left: 4vw; right: 4vw; top: 64%; height: 0; }
  .type .num { position: absolute; left: 0; bottom: 0; white-space: nowrap; font-family: "Anybody", sans-serif; line-height: .8; letter-spacing: -.02em; transform-origin: 0 100%; font-variant-numeric: tabular-nums; }
  .type .ghost { color: #2B44FF; }
  .type.done .ghost { color: #F4F1EA; }
  .type .week { position: absolute; right: 4vw; bottom: 92px; display: grid; gap: 2px; text-align: right; font-family: "Anybody", sans-serif; font-size: clamp(16px, 2.6vh, 34px); line-height: 1.05; }
  .type .week .today { color: #2B44FF; }
  .type.done .week .today { color: #F4F1EA; text-decoration: underline; text-underline-offset: 3px; }
  .type .ruler { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; border-top: 2px solid currentColor; overflow: hidden; }
  .type .ruler i { position: absolute; bottom: 0; width: 2px; background: currentColor; }
  .type .ruler b { position: absolute; bottom: 30px; font: 600 11px/1 var(--font-data); transform: translateX(-50%); }

  /* ---------- Сияние ---------- */
  .aur-ui { position: absolute; inset: 0; pointer-events: none; color: #F4F7FF; }
  .aur-ui .n { position: absolute; left: 0; right: 0; top: 12%; text-align: center; font: 300 clamp(64px, 14vh, 160px)/1 "Cormorant Garamond", serif; letter-spacing: .06em; font-variant-numeric: lining-nums tabular-nums; text-shadow: 0 0 40px rgba(120, 255, 200, .25); }
  .aur-ui .s { position: absolute; left: 0; right: 0; top: calc(12% + clamp(70px, 15vh, 170px)); text-align: center; font: 500 13px/1 var(--font-data); letter-spacing: .3em; text-transform: uppercase; opacity: .7; }
  .aur-ui .whisper { position: absolute; left: 6%; bottom: 23%; font: italic 500 clamp(18px, 2.8vh, 38px)/1.2 "Cormorant Garamond", serif; max-width: 60%; opacity: .9; }
  .aur-ui .bars { position: absolute; right: 6%; bottom: 7%; display: flex; gap: clamp(10px, 1vw, 22px); align-items: flex-end; height: 20%; }
  .aur-ui .bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
  .aur-ui .bars i { width: clamp(10px, .7vw, 16px); border-radius: 6px; background: linear-gradient(#B58CFF, #3DFFB0); box-shadow: 0 0 14px rgba(80, 255, 180, .55); opacity: .75; }
  .aur-ui .bars .today i { opacity: 1; box-shadow: 0 0 22px rgba(120, 255, 200, .9); }
  .aur-ui .bars span { font: 500 clamp(10px, .7vw, 14px)/1 var(--font-data); opacity: .7; }
  .aur-ui svg { position: absolute; left: 3%; bottom: 7%; height: 14%; width: auto; }
</style>

<div class="stage" id="stage"></div>
<nav class="switch" role="tablist">
  <button role="tab" data-t="maslo">Масло</button>
  <button role="tab" data-t="shrift">Шрифт</button>
  <button role="tab" data-t="karta">Карта</button>
  <button role="tab" data-t="siyanie">Сияние</button>
  <button role="tab" data-t="arkada">Аркада</button>
</nav>
<div class="sim" aria-label="Симулятор дорожки">
  <div class="sim-in">
    <button class="play" id="play" aria-label="Идти или стоять"><svg width="18" height="18" viewBox="0 0 20 20" id="playIcon"></svg></button>
    <label>скорость<input type="range" id="spd" min="0" max="10" step="0.1"><output id="spdOut">0.0 км/ч</output></label>
    <label>сегодня<input type="range" id="stp" min="0" max="14000" step="50"><output id="stpOut">0</output></label>
  </div>
</div>

<script>
// ================= данные: одни на все миры =================
const $ = (s, r = document) => r.querySelector(s);
const nf = new Intl.NumberFormat('ru-RU');
const fmt = (n) => nf.format(Math.max(0, Math.round(n)));
const km = (m) => (m / 1000).toFixed(2).replace('.', ',');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const strideM = (v, h = 175) => (h / 100) * (0.26 + 0.035 * clamp(v, 1, 12));
const tierOf = (v) => (v <= 0 ? 0 : v < 3.5 ? 1 : v < 5.5 ? 2 : v < 7.5 ? 3 : 4);
const GOAL = 8000, SIM_X = 30;
const growth = (s) => (s <= 0 ? 0 : Math.min(1, Math.sqrt(s / GOAL)));
const state = { speed: 0, lastSpeed: 3.6, steps: 4300, distance: 3010 };
const PAST = [3200, 5100, 800, 6900, 8400, 10200]; // пример прошлых дней, не данные человека
const DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
function week() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86_400_000);
    const steps = i === 0 ? state.steps : PAST[6 - i];
    out.push({ label: DOW[d.getDay()], steps, km: i === 0 ? state.distance / 1000 : steps * 0.7 / 1000, today: i === 0 });
  }
  return out;
}
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Новость (веха) держится 4 секунды, потом снова обычная реплика.
const news = { text: '', until: 0 };
function announce(text) { news.text = text; news.until = performance.now() + 4000; }
const said = (base) => (performance.now() < news.until ? news.text : base);
function canvas2d(stage) {
  const c = document.createElement('canvas');
  stage.appendChild(c);
  return c;
}
function fit(c) {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const x = c.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { x, w, h, dpr };
}
function roundRect(x, l, t, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(l, t, w, h, r) : x.rect(l, t, w, h); }
function wrapText(x, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}

// ================= 1. Масло: герой — само Масло, оно бежит и тает от удовольствия =================
const B = {
  front: new Path2D('M22,48 C22,42 26,38 32,38 H88 C94,38 98,42 98,48 V84 C98,88 95,91 91,91 H29 C25,91 22,88 22,84 Z'),
  top: new Path2D('M24,40 H96 V51 H24 Z'),
  drip: new Path2D('M90,52 C90,62 95,64 95,71 C95,76 88,76 88,71 C88,66 86,62 86,52 Z'),
  curl: new Path2D('M44,40 C40,28 50,18 60,20 C70,22 72,32 65,35 C60,37 57,32 61,29'),
};
const Maslo = {
  milestones: [[100, 'Капнуло!'], [2000, 'Лужица растёт!'], [5000, 'Мягкое-мягкое…'], [GOAL, 'Растаяло от удовольствия!']],
  mount(stage) { this.c = canvas2d(stage); this.drops = []; this.splash = []; this.phase = 0; this.t = 0; },
  line() {
    const tier = tierOf(state.speed), s = state.steps;
    if (tier) return ['', 'Ой, тёпленько!', 'Таю, таю!', 'Жарко — но приятно!', 'Я лужица счастья!'][tier];
    if (s <= 0) return 'Я холодненькое. Пройдёмся — подтаю?';
    return s >= GOAL ? 'Растаяло от удовольствия!' : 'Уже подтаяло. Тепло-тепло…';
  },
  frame(dt) {
    const { x, w, h } = fit(this.c), g = growth(state.steps), tier = tierOf(state.speed), moving = state.speed > 0;
    this.t += dt; this.phase += Math.PI * (state.speed / 3.6 / strideM(state.speed || 1)) * dt;
    // тёплое небо и лучи
    const sky = x.createRadialGradient(w / 2, h * 0.58, 10, w / 2, h * 0.58, Math.max(w, h) * 0.8);
    sky.addColorStop(0, '#FFF1CF'); sky.addColorStop(0.45, '#FFD58E'); sky.addColorStop(1, '#F29A4A');
    x.fillStyle = sky; x.fillRect(0, 0, w, h);
    const floorY = h * 0.74;
    x.save(); x.translate(w / 2, floorY - h * 0.05); x.rotate(this.t * 0.05 * (1 + state.speed * 0.3));
    x.fillStyle = 'rgba(255,255,255,.12)';
    for (let i = 0; i < 16; i++) { x.rotate(Math.PI / 8); x.beginPath(); x.moveTo(0, 0); x.lineTo(-Math.max(w, h) * 0.08, -Math.max(w, h)); x.lineTo(Math.max(w, h) * 0.08, -Math.max(w, h)); x.fill(); }
    x.restore();
    // пол — тёплая глянцевая плоскость
    const fl = x.createLinearGradient(0, floorY, 0, h);
    fl.addColorStop(0, '#F3A955'); fl.addColorStop(1, '#D8772F');
    x.fillStyle = fl; x.fillRect(0, floorY, w, h - floorY);
    x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(0, floorY, w, 2);

    const S = Math.min(w * 0.42, h * 0.36), k = S / 80, cx = w / 2;
    const sx = 1 - 0.22 * g, sy = 1 - 0.48 * g, legs = 16 * k;
    const bob = moving ? -Math.abs(Math.cos(this.phase)) * (3 + state.speed * 0.6) * k * 0.3 : 0;
    const base = floorY - legs + bob;
    // лужица с отражением
    const prx = S * (0.3 + 1.05 * g), pry = prx * 0.2;
    if (state.steps > 0) {
      const pg = x.createRadialGradient(cx - prx * 0.3, floorY - pry * 0.3, 2, cx, floorY, prx);
      pg.addColorStop(0, '#FFF3C9'); pg.addColorStop(0.5, '#F7D477'); pg.addColorStop(1, '#E9B54E');
      x.fillStyle = pg; x.beginPath(); x.ellipse(cx, floorY + pry * 0.5, prx, pry, 0, 0, Math.PI * 2); x.fill();
      x.save(); x.beginPath(); x.ellipse(cx, floorY + pry * 0.5, prx, pry, 0, 0, Math.PI * 2); x.clip();
      x.globalAlpha = 0.28; x.translate(cx, floorY + legs * 0.2); x.scale(k * sx, -k * sy * 0.55); x.translate(-60, -91);
      x.fillStyle = '#F4CD6A'; x.fill(B.front); x.restore();
      x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 2;
      x.beginPath(); x.ellipse(cx - prx * 0.25, floorY + pry * 0.3, prx * 0.45, pry * 0.4, 0, Math.PI * 1.1, Math.PI * 1.7); x.stroke();
      for (const s of this.splash) { x.strokeStyle = `rgba(255,255,255,${(1 - s.life).toFixed(2)})`; x.beginPath(); x.ellipse(s.x, s.y, 3 + s.life * 14, (3 + s.life * 14) * 0.25, 0, 0, Math.PI * 2); x.stroke(); }
    }
    // ножки и ручки — не тают
    const limb = (x0, y0, x1, y1) => {
      x.lineCap = 'round';
      x.strokeStyle = '#C8962F'; x.lineWidth = 9 * k; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
      x.strokeStyle = '#F4CD6A'; x.lineWidth = 5 * k; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
    };
    const swing = moving ? Math.sin(this.phase) * Math.min(0.35 + state.speed * 0.06, 0.8) : 0;
    const hipL = cx - 16 * k * sx, hipR = cx + 16 * k * sx;
    limb(hipL, base - 2 * k, hipL + Math.sin(swing) * legs, base - 2 * k + Math.cos(swing) * legs);
    limb(hipR, base - 2 * k, hipR - Math.sin(swing) * legs, base - 2 * k + Math.cos(swing) * legs);
    const shY = base - 30 * k * sy;
    const armA = moving ? swing * 1.2 : 0;
    limb(cx - 38 * k * sx, shY, cx - 38 * k * sx - 12 * k - Math.sin(armA) * 6 * k, shY + 14 * k + Math.cos(armA) * 4 * k);
    limb(cx + 38 * k * sx, shY, cx + 38 * k * sx + 12 * k + Math.sin(armA) * 6 * k, shY + 14 * k - Math.cos(armA) * 4 * k);
    // тело: вырезка из бумаги, мягчеет и оседает
    x.save(); x.translate(cx, base); x.rotate((moving ? Math.sin(this.phase) * 0.03 : 0) + 0.035); x.scale(k * sx, k * sy); x.translate(-60, -91);
    x.save(); x.translate(0.6, 1.8); x.fillStyle = 'rgba(59,42,18,.3)'; x.fill(B.front); x.restore();
    x.fillStyle = '#F4CD6A'; x.fill(B.front);
    x.fillStyle = '#FBE6A8'; x.fill(B.top);
    x.fillStyle = '#F4CD6A'; x.fill(B.drip);
    x.strokeStyle = '#E8B25E'; x.lineWidth = 6; x.lineCap = 'round'; x.stroke(B.curl);
    if (tier >= 2) { x.strokeStyle = '#C2456F'; x.lineWidth = 7; x.beginPath(); x.moveTo(23, 56); x.lineTo(97, 56); x.stroke(); x.lineWidth = 4; x.beginPath(); x.moveTo(24, 56); x.lineTo(12, 50 + Math.sin(this.phase * 2) * 3); x.moveTo(24, 56); x.lineTo(13, 62 + Math.sin(this.phase * 2) * 3); x.stroke(); }
    x.restore();
    // лицо — ручкой, не сплющивается
    const P = (px, py) => [cx + (px - 60) * k * sx, base + (py - 91) * k * sy];
    const happy = state.steps >= GOAL || tier >= 4;
    x.strokeStyle = x.fillStyle = '#2C2618'; x.lineWidth = 2.2 * k; x.lineCap = 'round';
    for (const ex of [46, 74]) {
      const [ex2, ey2] = P(ex + (moving ? 2 : 0), 66);
      if (happy) { x.beginPath(); x.moveTo(ex2 - 5 * k, ey2 + k); x.quadraticCurveTo(ex2, ey2 - 6 * k, ex2 + 5 * k, ey2 + k); x.stroke(); }
      else { x.beginPath(); x.ellipse(ex2, ey2, 5.5 * k, 5.5 * k, 0, 0, Math.PI * 2); x.fill(); }
    }
    const [mx, my] = P(60 + (moving ? 1 : 0), 78);
    x.beginPath(); x.moveTo(mx - 6 * k, my); x.bezierCurveTo(mx - 3 * k, my + (happy ? 7 : 4) * k, mx + 3 * k, my + (happy ? 7 : 4) * k, mx + 6 * k, my); x.stroke();
    if (g > 0.25 || tier >= 3) { x.fillStyle = 'rgba(243,150,170,.55)'; for (const chx of [36, 84]) { const [a, b] = P(chx, 76); x.beginPath(); x.arc(a, b, 5 * k, 0, Math.PI * 2); x.fill(); } }
    // капли: стекают с боков в лужицу; пот — на темпе
    if (moving && !reduced) {
      if (Math.random() < dt * (0.8 + state.speed * 0.5)) {
        const side = Math.random() < 0.5 ? -1 : 1, [dx, dy] = P(side < 0 ? 24 : 96, 70 + Math.random() * 18);
        this.drops.push({ x: dx, y: dy, vx: side * (10 + Math.random() * 25), vy: -10, kind: 'melt' });
      }
      if (tier >= 3 && Math.random() < dt * (state.speed - 4) * 0.35) { const [dx, dy] = P(30 + Math.random() * 60, 42); this.drops.push({ x: dx, y: dy, vx: (Math.random() - 0.5) * 120, vy: -120 - Math.random() * 60, kind: 'sweat' }); }
    }
    for (const d of this.drops) { d.vy += 520 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
    for (const d of this.drops) if (d.y > floorY + 2 && !d.done) { d.done = true; if (d.kind === 'melt') this.splash.push({ x: d.x, y: floorY + 4, life: 0 }); }
    this.drops = this.drops.filter((d) => !d.done && d.y < h);
    for (const s of this.splash) s.life += dt * 1.6;
    this.splash = this.splash.filter((s) => s.life < 1);
    for (const d of this.drops) {
      x.fillStyle = d.kind === 'melt' ? '#F7D477' : '#A8D2EE';
      const ds = d.kind === 'melt' ? 0.75 : 0.45; x.beginPath(); x.ellipse(d.x, d.y, 3.2 * k * ds, 4.4 * k * ds, 0, 0, Math.PI * 2); x.fill();
    }
    // марево над головой на жаре
    if (tier >= 3) {
      x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 2;
      for (let i = 0; i < 4; i++) { const hx = cx - S * 0.4 + i * S * 0.27; x.beginPath(); for (let yy = 0; yy < S * 0.6; yy += 4) x.lineTo(hx + Math.sin(yy * 0.08 + this.t * 6 + i) * 5, base - S * 1.05 - yy); x.stroke(); }
    }
    // число и неделя
    const pad = Math.max(20, w * 0.04), big = Math.min(w * 0.16, h * 0.14);
    x.fillStyle = '#6B3E0A'; x.textBaseline = 'top';
    x.font = `800 ${big}px Manrope, sans-serif`; x.fillText(fmt(state.steps), pad, pad + 40);
    x.font = `600 ${Math.max(13, big * 0.18)}px "JetBrains Mono", monospace`; x.fillStyle = 'rgba(107,62,10,.75)';
    x.fillText(`${km(state.distance)} км`, pad + 4, pad + 44 + big);
    const days = week(), cell = Math.min(110, Math.max(64, w * 0.05), (w - pad * 2) / 7), wx = w / 2 - cell * 3.5, wy = h - Math.max(26, h * 0.05);
    days.forEach((d, i) => {
      const gg = growth(d.steps), r = 5 + gg * cell * 0.36, ccx = wx + cell * i + cell / 2;
      x.fillStyle = d.steps >= GOAL ? '#FFE9A6' : 'rgba(255,230,160,.75)';
      x.beginPath(); x.ellipse(ccx, wy - 14, r, r * 0.32, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.ellipse(ccx - r * 0.3, wy - 15, r * 0.3, r * 0.08, 0, 0, Math.PI * 2); x.fill();

const Siyanie = {
  milestones: [[100, 'Первая искорка в небе.'], [2500, 'Смотри, разгорается.'], [GOAL, 'Небо горит — это мы зажгли.']],
  mount(stage) {
    this.c = canvas2d(stage);
    stage.insertAdjacentHTML('beforeend', `<div class="aur-ui"><div class="n" id="auN"></div><div class="s" id="auS"></div>
      <svg viewBox="0 0 60 80"><path d="M30,18 C42,18 48,36 48,48 C48,62 40,70 30,70 C20,70 12,62 12,48 C12,36 18,18 30,18 Z M30,19 L25,7 M30,19 L30,4 M30,19 L35,7" fill="#0A0F1A" stroke="#0A0F1A" stroke-width="3" stroke-linecap="round"/><path d="M24,70 L22,80 M36,70 L38,80" stroke="#0A0F1A" stroke-width="5" stroke-linecap="round"/></svg>
      <div class="whisper" id="auW"></div><div class="bars" id="auB"></div></div>`);
    const gl = this.gl = this.c.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
    this.time = 7; this.glow = growth(state.steps); this.gold = state.steps >= GOAL ? 1 : 0;
    if (!gl) return;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const pr = this.pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, AURORA_FS));
    gl.linkProgram(pr); gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.u = Object.fromEntries(['res', 'time', 'glow', 'gold'].map((n) => [n, gl.getUniformLocation(pr, n)]));
  },
  frame(dt) {
    this.time += dt * (0.25 + state.speed * 0.45);
    this.glow = lerp(this.glow, 0.1 + 0.85 * growth(state.steps), Math.min(1, dt * 2) || 1);
    this.gold = lerp(this.gold, state.steps >= GOAL ? 1 : 0, Math.min(1, dt * 1.5) || 1);
    const gl = this.gl;
    if (gl) {
      const dpr = Math.min(devicePixelRatio || 1, 1.5), w = Math.round(this.c.clientWidth * dpr), h = Math.round(this.c.clientHeight * dpr);
      if (this.c.width !== w || this.c.height !== h) { this.c.width = w; this.c.height = h; }
      gl.viewport(0, 0, w, h);
      gl.uniform2f(this.u.res, w, h); gl.uniform1f(this.u.time, this.time); gl.uniform1f(this.u.glow, this.glow); gl.uniform1f(this.u.gold, this.gold);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    $('#auN').textContent = fmt(state.steps);
    $('#auS').textContent = `шагов сегодня · ${km(state.distance)} км`;
    const tier = tierOf(state.speed);
    $('#auW').textContent = said(tier ? ['', 'Тише… слышишь, как течёт?', 'Ленты пошли волнами.', 'Небо танцует!', 'Ого, как несётся!'][tier]
      : state.steps <= 0 ? 'Небо молчит. Пройдёмся — заиграет?' : state.steps >= GOAL ? 'Самое яркое небо.' : 'Небо разгорается.');
    const wk = week().map((d) => `<div class="${d.today ? 'today' : ''}"><i style="height:calc(${growth(d.steps).toFixed(3)} * 15vh + 6px)"></i><span>${d.today ? '•' : d.label}</span></div>`).join('');
    if ($('#auB').innerHTML !== wk) $('#auB').innerHTML = wk;
  },
  busy() { return Math.abs(this.glow - (0.1 + 0.85 * growth(state.steps))) > 0.01 || Math.abs(this.gold - (state.steps >= GOAL ? 1 : 0)) > 0.01; },
};

// ================= 5. Аркада: пиксельный бег, монета за каждые 100 шагов, мир — за каждые 2000 =================
const PIX = {
  stand: ['....d.d...', '.....d....', '...gggg...', '..gggggg..', '.gggggggg.', '.gkggggkg.', '.gggggggg.', '.ggggkkgg.', '.gggggggg.', '..gggggg..', '...d..d...', '...d..d...'],
  run1: ['....d.d...', '.....d....', '...gggg...', '..gggggg..', '.gggggggg.', '.ggkgggkg.', '.gggggggg.', '.gggggkkg.', '.gggggggg.', '..gggggg..', '..d....d..', '.d......d.'],
  run2: ['...d.d....', '.....d....', '...gggg...', '..gggggg..', '.gggggggg.', '.ggkgggkg.', '.gggggggg.', '.gggggkkg.', '.gggggggg.', '..gggggg..', '....dd....', '....dd....'],
  coin: ['.yyy.', 'yywyy', 'yywyy', 'yywyy', '.yyy.'],
};
const PIX_C = { g: '#7FBF8C', d: '#3E7A4B', k: '#1A1A1A', y: '#FFD23F', w: '#FFF6C8' };
const WORLDS = [
  { name: 'ЛУГ', sky: '#6EC6FF', far: '#3FA36B', near: '#2E8B57', top: '#5BD15B', dirt: '#9A6332' },
  { name: 'ПУСТЫНЯ', sky: '#FFC66E', far: '#E9A35B', near: '#C47B3C', top: '#F2CF7A', dirt: '#C98B4A' },
  { name: 'СНЕГ', sky: '#BFD9F2', far: '#93B2CF', near: '#6F8FB0', top: '#FFFFFF', dirt: '#A9C0D6' },
  { name: 'НОЧЬ', sky: '#1B1F4B', far: '#2C2C6E', near: '#3A2E5C', top: '#6A5ACD', dirt: '#3B2F63' },
  { name: 'КОНФЕТЫ', sky: '#FFB3D9', far: '#FF8CC6', near: '#E35DA8', top: '#FFF0F7', dirt: '#E879B6' },
];
const Arkada = {
  milestones: [],
  mount(stage) { this.c = canvas2d(stage); this.lo = document.createElement('canvas'); this.scroll = 0; this.anim = 0; this.pops = []; this.dust = []; this.t = 0; this.lastCoins = Math.floor(state.steps / 100); this.wipe = 0; this.lastWorld = this.worldOf(state.steps); },
  worldOf(s) { return Math.min(Math.floor(s / 2000), 4); },
  sprite(x, rows, px, py, flip = false) {
    rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = PIX_C[ch]; x.fillRect(px + (flip ? row.length - 1 - i : i), py + j, 1, 1); } }));
  },
  frame(dt) {
    const { x, w, h, dpr } = fit(this.c), moving = state.speed > 0, tier = tierOf(state.speed);
    this.t += dt;
    const BH = 80, BW = Math.max(80, Math.round(BH * w / h));
    if (this.lo.width !== BW) { this.lo.width = BW; this.lo.height = BH; }
    const l = this.lo.getContext('2d');
    const wi = this.worldOf(state.steps), W = WORLDS[wi];
    if (wi !== this.lastWorld) { if (wi > this.lastWorld) { this.wipe = 1; announce(`МИР ${wi + 1}: ${W.name}`); } this.lastWorld = wi; }
    const coins = Math.floor(state.steps / 100);
    if (coins > this.lastCoins && moving) this.pops.push({ y: 0, life: 0 });
    this.lastCoins = coins;
    this.scroll += state.speed * 6 * dt; this.anim += dt * (2 + state.speed * 1.6);
    // мир: небо, дальние холмы, ближние, земля плитками
    l.fillStyle = W.sky; l.fillRect(0, 0, BW, BH);
    if (wi === 3) { const r = rng(9); for (let i = 0; i < 40; i++) { l.fillStyle = '#FFFFFF'; l.fillRect(Math.floor(r() * BW), Math.floor(r() * 40), 1, 1); } l.fillStyle = '#FFF6C8'; l.fillRect(BW - 24, 8, 6, 6); }
    const layer = (color, speed, base, amp, period) => {
      l.fillStyle = color;
      for (let px = 0; px < BW; px++) {
        const wx = px + this.scroll * speed, yy = base - Math.round(Math.abs(Math.sin(wx / period)) * amp + Math.abs(Math.sin(wx / (period * 0.37))) * amp * 0.3);
        l.fillRect(px, yy, 1, BH - yy);
      }
    };
    layer(W.far, 0.2, 57, 17, 34); layer(W.near, 0.5, 61, 8, 15);
    for (let i = 0; i < 4; i++) { const cx = Math.round(((i * 70 - this.scroll * 0.1) % (BW + 40) + BW + 40) % (BW + 40)) - 20; l.fillStyle = wi === 3 ? '#2E3470' : '#FFFFFF'; l.fillRect(cx, 9 + i * 5, 14, 3); l.fillRect(cx + 3, 7 + i * 5, 8, 2); }
    const groundY = 64;
    l.fillStyle = W.dirt; l.fillRect(0, groundY, BW, BH - groundY);
    l.fillStyle = W.top; l.fillRect(0, groundY, BW, 3);
    l.fillStyle = 'rgba(0,0,0,.18)';
    for (let px = -(Math.floor(this.scroll) % 8); px < BW; px += 8) for (let py = groundY + 5; py < BH; py += 8) l.fillRect(px + ((py / 8) % 2 ? 4 : 0), py, 4, 1);
    // бегун
    const gx = Math.round(BW * 0.32), frame = moving ? (Math.floor(this.anim) % 2 ? PIX.run1 : PIX.run2) : PIX.stand;
    const jump = moving ? -Math.round(Math.abs(Math.sin(this.anim * Math.PI)) * 2) : 0;
    if (tier >= 4) for (let k = 1; k <= 3; k++) { l.globalAlpha = 0.25 / k; this.sprite(l, frame, gx - k * 4, groundY - 12 + jump); }
    l.globalAlpha = 1;
    this.sprite(l, frame, gx, groundY - 12 + jump);
    if (tier >= 2 && Math.random() < dt * state.speed * 3) this.dust.push({ x: gx, y: groundY - 2, life: 0 });
    for (const d of this.dust) { d.x -= dt * (20 + state.speed * 8); d.life += dt * 2; }
    this.dust = this.dust.filter((d) => d.life < 1);
    for (const d of this.dust) { l.fillStyle = `rgba(255,255,255,${(1 - d.life).toFixed(2)})`; l.fillRect(Math.round(d.x), Math.round(d.y - d.life * 4), 2, 2); }
    // монета выскакивает над головой
    for (const p of this.pops) { p.life += dt * 2.2; }
    this.pops = this.pops.filter((p) => p.life < 1);
    for (const p of this.pops) {
      const cy = groundY - 22 - Math.round(Math.sin(p.life * Math.PI) * 14);
      const spin = Math.floor(p.life * 8) % 2;
      this.sprite(l, spin ? PIX.coin : PIX.coin.map((r) => '.' + r.slice(1, 4) + '.'), gx + 3, cy);
    }
    // цель: салют
    if (state.steps >= GOAL) {
      const r = rng(Math.floor(this.t * (moving ? 3 : 0)) + 5);
      for (let b = 0; b < 3; b++) { const bx = 16 + r() * (BW - 32), by = 10 + r() * 20, col = ['#FFD23F', '#FF5FA2', '#7FDBFF'][b]; for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2, rr = 4 + r() * 4; l.fillStyle = col; l.fillRect(Math.round(bx + Math.cos(a) * rr), Math.round(by + Math.sin(a) * rr), 1, 1); } }
    }
    // шторка при смене мира
    if (this.wipe > 0) { l.fillStyle = '#000'; const cw = Math.round(BW * this.wipe); l.fillRect(0, 0, cw, BH); this.wipe = Math.max(0, this.wipe - dt * 1.6); }
    x.imageSmoothingEnabled = false;
    x.drawImage(this.lo, 0, 0, w, h);
    // HUD шрифтом-пикселем
    const fs = Math.max(10, Math.round(h / 34 / 2) * 2);
    x.font = `${fs}px "Press Start 2P", monospace`; x.textBaseline = 'top';
    const shadow = (t, tx, ty, c = '#FFFFFF') => { x.fillStyle = '#000'; x.fillText(t, tx + fs * 0.15, ty + fs * 0.15); x.fillStyle = c; x.fillText(t, tx, ty); };
    const top = 64;
    shadow('ШАГИ', 24, top); shadow(String(Math.round(state.steps)).padStart(6, '0'), 24, top + fs * 1.6);
    const cx2 = w * 0.38; shadow('МОНЕТЫ', cx2, top); shadow(`×${String(coins).padStart(3, '0')}`, cx2, top + fs * 1.6, '#FFD23F');
    const lvl = Math.floor((state.steps % 2000) / 500) + 1;
    const rx = w * 0.62; shadow('МИР', rx, top); shadow(`${wi + 1}-${Math.min(lvl, 4)}`, rx, top + fs * 1.6);
    if (performance.now() < news.until) { x.textAlign = 'center'; shadow(news.text, w / 2, h * 0.3, '#FFD23F'); x.textAlign = 'left'; }
    else if (state.steps >= GOAL) { x.textAlign = 'center'; shadow('ЦЕЛЬ!', w / 2, h * 0.3, '#FF5FA2'); x.textAlign = 'left'; }
    // таблица рекордов недели
    const days = week(), bw = fs * 13, bh = fs * 2.2 + days.length * fs * 1.7, bx = w - bw - 24, by = top - 8;
    x.fillStyle = 'rgba(0,0,0,.72)'; x.fillRect(bx, by, bw, bh);
    x.strokeStyle = '#FFFFFF'; x.lineWidth = Math.max(2, fs / 5); x.strokeRect(bx + 3, by + 3, bw - 6, bh - 6);
    shadow('РЕКОРДЫ', bx + fs, by + fs * 0.8, '#FFD23F');
    const blink = moving && Math.floor(this.t * 3) % 2;
    days.forEach((d, i) => {
      const yy = by + fs * 2.4 + i * fs * 1.7;
      const c = d.today ? (blink ? '#000' : '#7FDBFF') : '#FFFFFF';
      x.fillStyle = c; x.fillText(`${d.label.toUpperCase()} ${String(Math.round(d.steps)).padStart(6, '0')}${d.steps >= GOAL ? '★' : ''}`, bx + fs, yy);
    });
    x.textBaseline = 'alphabetic';
  },
  busy() { return this.pops.length > 0 || this.dust.length > 0 || this.wipe > 0; },
};

// ================= оркестр =================
const THEMES = { maslo: Maslo, shrift: Shrift, karta: Karta, siyanie: Siyanie, arkada: Arkada };
let theme = null, lastSteps = state.steps;
function show(name) {
  if (!THEMES[name]) name = 'maslo';
  const stage = $('#stage');
  stage.innerHTML = '';
  theme = THEMES[name];
  document.querySelectorAll('.switch button').forEach((b) => b.setAttribute('aria-selected', b.dataset.t === name));
  news.until = 0;
  theme.mount(stage);
  kick();
}
function checkMilestones() {
  const now = state.steps;
  if (now > lastSteps) for (const [s, text] of theme.milestones) if (lastSteps < s && now >= s) announce(text);
  lastSteps = now;
}
let raf = 0, lastT = 0, lastSync = 0;
function kick() { if (!raf) { lastT = 0; raf = requestAnimationFrame(tick); } }
function tick(t) {
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.1) : 0;
  lastT = t;
  if (state.speed > 0) {
    const mps = state.speed / 3.6;
    state.steps = Math.min(14000, state.steps + (mps / strideM(state.speed)) * dt * SIM_X);
    state.distance += mps * dt * SIM_X;
    if (state.steps >= 14000) state.speed = 0;
  }
  checkMilestones();
  theme.frame(reduced && state.speed > 0 ? dt * 0.2 : dt);
  if (t - lastSync > 150) { syncSim(); lastSync = t; }
  // Анимация идёт, только пока идём (или доигрывает короткое движение); стоим — один кадр и тишина.
  raf = state.speed > 0 || theme.busy?.() || performance.now() < news.until ? requestAnimationFrame(tick) : 0;
  if (!raf) syncSim();
}
function syncSim() {
  $('#spd').value = state.speed;
  $('#spdOut').textContent = `${state.speed.toFixed(1)} км/ч`;
  $('#stp').value = Math.round(state.steps);
  $('#stpOut').textContent = fmt(state.steps);
  $('#playIcon').innerHTML = state.speed > 0
    ? '<rect x="4" y="3" width="4.5" height="14" rx="1" fill="currentColor"/><rect x="11.5" y="3" width="4.5" height="14" rx="1" fill="currentColor"/>'
    : '<path d="M5,3 L17,10 L5,17 Z" fill="currentColor"/>';
}
function setSpeed(v) { if (v > 0) state.lastSpeed = v; state.speed = v; syncSim(); kick(); }
$('#play').addEventListener('click', () => setSpeed(state.speed > 0 ? 0 : state.lastSpeed));
$('#spd').addEventListener('input', (e) => setSpeed(+e.target.value));
$('#stp').addEventListener('input', (e) => { state.steps = +e.target.value; state.distance = state.steps * strideM(state.lastSpeed); syncSim(); kick(); });
document.querySelectorAll('.switch button').forEach((b) => b.addEventListener('click', () => { location.hash = b.dataset.t; }));
addEventListener('hashchange', () => show(location.hash.slice(1)));
new ResizeObserver(() => kick()).observe($('#stage'));
document.fonts?.ready.then(() => kick());
syncSim();
show(location.hash.slice(1));
</script>
